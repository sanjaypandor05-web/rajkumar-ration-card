<!DOCTYPE html>

<html lang="gu">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Admin Login | Rajkumar Ration Card Portal
</title>

<link
    rel="stylesheet"
    href="admin.css"
>
```

</head>

<body>

<!-- =========================================
     LOGIN CONTAINER
========================================= -->

<div class="login-container">

```
<div class="login-card">


    <!-- LOGO -->

    <div class="logo">
        🪪
    </div>


    <!-- TITLE -->

    <h1>
        Rajkumar Ration Card Portal
    </h1>


    <p>
        Admin Login
    </p>


    <!-- =====================================
         USERNAME
    ====================================== -->

    <div class="input-group">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter Username"
            autocomplete="username"
        >

    </div>


    <!-- =====================================
         PASSWORD
    ====================================== -->

    <div class="input-group">

        <label for="password">
            Password
        </label>


        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                autocomplete="current-password"
            >


            <button
                type="button"
                onclick="togglePassword()"
                title="Show / Hide Password"
            >
                👁
            </button>

        </div>

    </div>


    <!-- =====================================
         LOGIN BUTTON
    ====================================== -->

    <button
        type="button"
        class="login-btn"
        onclick="login()"
    >
        🔐 Login
    </button>


    <!-- =====================================
         MESSAGE
    ====================================== -->

    <div id="msg"></div>


    <hr>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 Rajkumar Ration Card Portal

    </div>


</div>
```

</div>

<!-- =========================================
     PASSWORD TOGGLE
========================================= -->

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    if (!password) {
        return;
    }

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

<!-- =========================================
     ADMIN JAVASCRIPT
========================================= -->

<script src="admin.js"></script>

</body>

</html>
