```html
<!DOCTYPE html>
<html lang="gu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - Rajkumar Ration Card Portal</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="login-container">

        <!-- LOGO -->
        <div class="logo">
            🪪
        </div>


        <!-- TITLE -->
        <h1>
            Rajkumar Ration Card Portal
        </h1>

        <p class="subtitle">
            Admin Login
        </p>


        <!-- LOGIN FORM -->
        <form
            id="adminLoginForm"
            autocomplete="off"
            onsubmit="return false;"
        >


            <!-- USERNAME -->
            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="login_user_temp"
                    placeholder="Enter Username"

                    autocomplete="off"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"

                    readonly
                    onfocus="this.removeAttribute('readonly');"
                >

            </div>


            <!-- PASSWORD -->
            <div class="input-group">

                <label for="adminPassword">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="adminPassword"
                        name="login_pass_temp"

                        placeholder="Enter Password"

                        autocomplete="new-password"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"

                        readonly
                        onfocus="this.removeAttribute('readonly');"
                    >

                    <button
                        type="button"
                        id="togglePasswordBtn"
                        title="Show / Hide Password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->
            <button
                type="submit"
                id="loginBtn"
                class="login-btn"
            >
                🔐 Login
            </button>


            <!-- MESSAGE -->
            <div id="msg"></div>

        </form>


        <hr>


        <!-- FOOTER -->
        <div class="footer">
            © 2026 Rajkumar Ration Card Portal
        </div>

    </div>


    <!-- LOGIN JS -->
    <script src="login.js"></script>

</body>

</html>
```
