<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Rajkumar Ration Card Portal</title>

<link rel="stylesheet" href="login.css">

</head>

<body>

<!-- ================= LOGIN CONTAINER ================= -->

<div class="login-container">

<div class="login-box">

<div class="login-header">

<h2>🔐 Login Panel</h2>

<p>Rajkumar Ration Card Portal</p>

</div>

<!-- ================= LOGIN FORM ================= -->

<div class="login-form">

<label>Login Type</label>

<select id="loginType">

<option value="admin">👑 Admin</option>

<option value="retailer">🏪 Retailer</option>

</select>

<label>User ID</label>

<input
type="text"
id="username"
placeholder="Enter User ID">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter Password">
<!-- ================= LOGIN BUTTON ================= -->

<br>

<button
id="loginBtn"
onclick="loginUser()">

🔓 Login

</button>

<p
id="loginError"
class="error-message">

</p>

<div class="login-links">

<a href="index.html">

🏠 Back to Home

</a>

</div>

</div>
<!-- login-form END -->
<!-- ================= LOGIN FOOTER ================= -->

<div class="login-footer">

<p>

© 2026 Rajkumar Ration Card Portal

</p>

</div>

</div>
<!-- login-box END -->

</div>
<!-- login-container END -->
  <!-- ================= JAVASCRIPT ================= -->

<script src="login.js"></script>

</body>

</html>
