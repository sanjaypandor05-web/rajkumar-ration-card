<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Rajkumar Ration Card Portal</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<div class="login-container">


<div class="login-card">



<div class="logo">

🪪

</div>



<h1>
Rajkumar Ration Card Portal
</h1>



<p>
Admin Login
</p>





<div class="input-group">


<label>
Username
</label>


<input

type="text"

id="username"

placeholder="Enter Username">


</div>







<div class="input-group">


<label>
Password
</label>



<div class="password-box">


<input

type="password"

id="password"

placeholder="Enter Password">



<button

type="button"

onclick="togglePassword()">

👁

</button>


</div>


</div>







<button

class="login-btn"

onclick="adminLogin()">

Login


</button>





<div id="msg">

</div>






<hr>





<div class="footer">


© 2026 Rajkumar Ration Card Portal


</div>



</div>


</div>











<script src="login.js"></script>

</body>
</html>
