<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Track Application | Rajkumar Ration Card Portal</title>

<link rel="stylesheet" href="track.css">

</head>


<body>


<header>

    <div class="logo">
        🪪 Rajkumar Ration Card
    </div>

    <a href="index.html" class="back-btn">
        ← Home
    </a>

</header>



<main class="track-page">


    <div class="track-card">


        <div class="icon">
            🔎
        </div>


        <h1>
            અરજીનું સ્ટેટસ તપાસો
        </h1>


        <p class="subtitle">
            તમારી Application ID નાખીને અરજીનું સ્ટેટસ જુઓ
        </p>



        <!-- APPLICATION ID -->

        <label for="applicationId">
            Application ID
        </label>


        <input
            type="text"
            id="applicationId"
            placeholder="ઉદાહરણ: RC20260001"
            maxlength="20"
            autocomplete="off"
        >



        <button
            id="trackBtn"
            onclick="trackApplication()">

            🔍 Track Application

        </button>



        <div id="msg"></div>



        <!-- RESULT -->

        <div
            id="result"
            class="result"
            style="display:none;">


            <div class="result-header">

                <h2>
                    અરજીની વિગતો
                </h2>

            </div>



            <!-- APPLICATION ID -->

            <div class="detail-row">

                <span>
                    Application ID
                </span>

                <strong id="showApplicationId">
                    -
                </strong>

            </div>



            <!-- FINAL NAME -->

            <div class="detail-row">

                <span>
                    નામ
                </span>

                <strong id="showName">
                    -
                </strong>

            </div>



            <!-- SERVICE -->

            <div class="detail-row">

                <span>
                    સેવા
                </span>

                <strong id="showService">
                    -
                </strong>

            </div>



            <!-- DATE -->

            <div class="detail-row">

                <span>
                    અરજી તારીખ
                </span>

                <strong id="showDate">
                    -
                </strong>

            </div>



            <hr>



            <!-- PAYMENT STATUS -->

            <div class="status-box">

                <span>
                    💳 Payment Status
                </span>

                <strong id="paymentStatus">
                    -
                </strong>

            </div>



            <!-- APPLICATION STATUS -->

            <div class="status-box">

                <span>
                    📋 Application Status
                </span>

                <strong id="applicationStatus">
                    -
                </strong>

            </div>


        </div>



        <div class="help-box">

            <strong>
                💡 નોંધ:
            </strong>

            <br>

            Application ID તમને અરજી submit કર્યા પછી
            મળ્યો હતો.

        </div>


    </div>


</main>



<script src="track.js"></script>

</body>

</html>
