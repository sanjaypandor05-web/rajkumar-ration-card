<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>રેશન કાર્ડ અરજી | Rajkumar Ration Card Portal</title>

<link rel="stylesheet" href="apply.css">

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <div class="logo">
        🪪 Rajkumar Ration Card
    </div>

    <a href="index.html" class="back">
        ← Home
    </a>

</header>



<!-- =========================================
     APPLICATION PAGE
========================================= -->

<section class="apply-page">

<div class="apply-card">


<h1>
    રેશન કાર્ડ અરજી ફોર્મ
</h1>

<p>
    તમારી સાચી માહિતી ભરીને અરજી મોકલો
</p>



<!-- =========================================
     ENGLISH NAME
========================================= -->

<label>
    આધાર કાર્ડ મુજબ English Name
</label>

<input
    type="text"
    id="englishName"
    placeholder="AS PER ADHARCARD"
    autocomplete="name"
>



<!-- =========================================
     GUJARATI NAME
========================================= -->

<label>
    રેશન કાર્ડ માટે ગુજરાતી નામ
</label>

<input
    type="text"
    id="gujaratiName"
    placeholder="રેશન કાર્ડમાં જે ગુજરાતી નામ રાખવું હોય તે લખો"
>



<!-- =========================================
     NAME TYPE
========================================= -->

<label>
    નામ કયા પ્રમાણે જોઈએ?
</label>


<div class="radio-box">


<label>

<input
    type="radio"
    name="nameType"
    value="Self"
    checked
    onchange="nameTypeChange()"
>

આધાર કાર્ડ મુજબ નામ

</label>



<label>

<input
    type="radio"
    name="nameType"
    value="Husband"
    onchange="nameTypeChange()"
>

પતિના નામ મુજબ નામ

</label>


</div>



<!-- =========================================
     HUSBAND NAME
========================================= -->

<div
    id="husbandBox"
    style="display:none;"
>

<label>
    પતિનું નામ
</label>

<input
    type="text"
    id="husband"
    placeholder="રમેશભાઈ પટેલ"
>

</div>



<!-- =========================================
     FINAL NAME PREVIEW
========================================= -->

<div
    id="finalNameBox"
    style="display:none;"
>

<label>
    Final Name
</label>

<input
    type="text"
    id="finalName"
    readonly
>

</div>



<!-- =========================================
     MOBILE
========================================= -->

<label>
    મોબાઇલ નંબર
</label>

<input
    type="tel"
    id="mobile"
    maxlength="10"
    inputmode="numeric"
    placeholder="10 અંકનો મોબાઇલ નંબર"
>



<!-- =========================================
     VILLAGE
========================================= -->

<label>
    ગામ
</label>

<input
    type="text"
    id="village"
    placeholder="ગામ"
>



<!-- =========================================
     TALUKA
========================================= -->

<label>
    તાલુકો
</label>

<input
    type="text"
    id="taluka"
    placeholder="તાલુકો"
>



<!-- =========================================
     DISTRICT
========================================= -->

<label>
    જિલ્લો
</label>

<input
    type="text"
    id="district"
    placeholder="જિલ્લો"
>



<!-- =========================================
     RATION CARD NUMBER
========================================= -->

<label>
    રેશન કાર્ડ નંબર
</label>

<input
    type="text"
    id="rationNo"
    placeholder="રેશન કાર્ડ નંબર"
>



<!-- =========================================
     SERVICE
========================================= -->

<label>
    સેવા પસંદ કરો
</label>

<select id="service">

<option value="">
    સેવા પસંદ કરો
</option>

<option value="New Ration Card">
    નવું રેશન કાર્ડ
</option>

<option value="Add Name">
    નામ ઉમેરવું
</option>

<option value="Remove Name">
    નામ કાપવું
</option>

<option value="Correction">
    રેશન કાર્ડ સુધારો
</option>

</select>



<!-- =========================================
     PAYMENT QR
========================================= -->

<div class="payment-box">

<h3>
    💳 Payment કરો
</h3>


<img
    src="QR.jpeg"
    class="qr-code"
    alt="Payment QR Code"
>


<p>
    QR Code Scan કરીને Payment કરો
</p>

<p>
    Payment કર્યા પછી Transaction ID નીચે લખો
</p>

</div>



<!-- =========================================
     TRANSACTION ID
========================================= -->

<label>
    Payment UTR / Transaction ID
</label>

<input
    type="text"
    id="transactionId"
    placeholder="UPI Transaction ID લખો"
>



<!-- =========================================
     AADHAAR PDF
========================================= -->

<label>
    આધાર કાર્ડ PDF
</label>

<input
    type="file"
    id="aadhaar"
    accept="application/pdf,.pdf"
>


<small>
    માત્ર PDF File અપલોડ કરો
</small>



<!-- =========================================
     RATION CARD PDF
========================================= -->

<label>
    રેશન કાર્ડ PDF
</label>

<input
    type="file"
    id="ration"
    accept="application/pdf,.pdf"
>


<small>
    માત્ર PDF File અપલોડ કરો
</small>



<!-- =========================================
     PAYMENT SCREENSHOT
========================================= -->

<label>
    Payment Screenshot
</label>

<input
    type="file"
    id="payment"
    accept="image/*,.pdf"
>


<small>
    Payment કર્યા પછી Screenshot અપલોડ કરો
</small>



<!-- =========================================
     SUBMIT
========================================= -->

<button
    type="button"
    id="submitBtn"
    onclick="sendApplication()"
>

    📝 અરજી મોકલો

</button>



<!-- =========================================
     MESSAGE
========================================= -->

<div
    id="msg"
    style="margin-top:15px;"
></div>



</div>

</section>



<!-- =========================================
     NAME TYPE SCRIPT
========================================= -->

<script>

function nameTypeChange() {

    const type =
        document.querySelector(
            'input[name="nameType"]:checked'
        ).value;


    const husbandBox =
        document.getElementById(
            "husbandBox"
        );


    const husband =
        document.getElementById(
            "husband"
        );


    const finalNameBox =
        document.getElementById(
            "finalNameBox"
        );


    if (type === "Husband") {

        husbandBox.style.display =
            "block";

        finalNameBox.style.display =
            "block";

    }

    else {

        husbandBox.style.display =
            "none";

        finalNameBox.style.display =
            "none";

        husband.value = "";

    }

}



function updateFinalName() {

    const type =
        document.querySelector(
            'input[name="nameType"]:checked'
        ).value;


    const gujaratiName =
        document.getElementById(
            "gujaratiName"
        ).value.trim();


    const husband =
        document.getElementById(
            "husband"
        ).value.trim();


    const finalName =
        document.getElementById(
            "finalName"
        );


    if (!finalName) return;


    if (type === "Husband") {

        if (
            gujaratiName !== "" &&
            husband !== ""
        ) {

            finalName.value =
                gujaratiName +
                " W/O " +
                husband;

        }

        else {

            finalName.value =
                gujaratiName;

        }

    }

    else {

        finalName.value =
            gujaratiName;

    }

}



document.addEventListener(
    "DOMContentLoaded",
    function () {

        const gujarati =
            document.getElementById(
                "gujaratiName"
            );

        const husband =
            document.getElementById(
                "husband"
            );


        if (gujarati) {

            gujarati.addEventListener(
                "input",
                updateFinalName
            );

        }


        if (husband) {

            husband.addEventListener(
                "input",
                updateFinalName
            );

        }

    }
);

</script>



<script src="apply.js"></script>


</body>

</html>
