<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>રેશન કાર્ડ અરજી</title>

<link rel="stylesheet" href="apply.css">

</head>


<body>


<header>

<div class="logo">

🪪 Rajkumar Ration Card

</div>


<a href="index.html" class="back">
← Home
</a>


</header>





<section class="apply-page">


<div class="apply-card">


<h1>
રેશન કાર્ડ અરજી ફોર્મ
</h1>


<p>
તમારી સાચી માહિતી ભરો
</p>





<label>
અરજદારનું નામ (English)
</label>

<input 
type="text"
id="englishName"
placeholder="PANDOR PRIYANKABEN SANJAYBHAI">



<label>
અરજદારનું નામ (ગુજરાતી)
</label>

<input 
type="text"
id="gujaratiName"
placeholder="પાંડોર પ્રિયંકાબેન સંજયભાઈ">





<label>
નામ કયા પ્રમાણે જોઈએ?
</label>


<div class="radio-box">


<label>

<input 
type="radio"
name="nameType"
value="Aadhaar"
checked
onclick="nameTypeChange()">

આધાર કાર્ડ મુજબ નામ

</label>




<label>

<input 
type="radio"
name="nameType"
value="Husband"
onclick="nameTypeChange()">

પતિના નામ મુજબ નામ

</label>


</div>






<div id="husbandBox" style="display:none">


<label>
પતિનું નામ
</label>


<input 
type="text"
id="husband"
placeholder="પતિનું પૂરું નામ">


</div>







<label>
મોબાઇલ નંબર
</label>


<input 
type="tel"
id="mobile"
maxlength="10"
placeholder="10 અંકનો મોબાઇલ નંબર">







<label>
ગામ
</label>


<input 
type="text"
id="village"
placeholder="ગામનું નામ">






<label>
તાલુકો
</label>


<input 
type="text"
id="taluka"
placeholder="તાલુકો">






<label>
જિલ્લો
</label>


<input 
type="text"
id="district"
placeholder="જિલ્લો">






<label>
રેશન કાર્ડ નંબર
</label>


<input 
type="text"
id="rationNo"
placeholder="રેશન કાર્ડ નંબર">







<label>
સેવા પસંદ કરો
</label>


<select id="service">


<option value="">
સેવા પસંદ કરો
</option>


<option value="New Ration Card">
નવું રેશન કાર્ડ
</option>


<option value="Add Name">
નામ ઉમેરવું
</option>


<option value="Remove Name">
નામ કાપવું
</option>


<option value="Correction">
સરનામું સુધારવું
</option>


<option value="Mobile Link">
મોબાઇલ નંબર લિંક
</option>


<option value="Duplicate">
ડુપ્લિકેટ રેશન કાર્ડ
</option>


</select>








<!-- PAYMENT -->


<div class="payment-box">


<h3>
💳 Payment કરો
</h3>


<img 
src="QR.jpeg"
alt="Payment QR Code"
class="qr-code">


<p>
UPI Payment કર્યા પછી Screenshot Upload કરો
</p>


</div>








<label>
આધાર કાર્ડ PDF
</label>


<input 
type="file"
id="aadhaar"
accept=".pdf">







<label>
રેશન કાર્ડ PDF
</label>


<input 
type="file"
id="ration"
accept=".pdf">







<label>
Payment Screenshot
</label>


<input 
type="file"
id="payment"
accept="image/*,.pdf">








<button onclick="sendApplication()">

અરજી મોકલો

</button>





<div id="msg"></div>




</div>


</section>







<script>


function nameTypeChange(){


let type =
document.querySelector(
'input[name="nameType"]:checked'
).value;



if(type=="Husband"){


document.getElementById(
"husbandBox"
).style.display="block";


}

else{


document.getElementById(
"husbandBox"
).style.display="none";


document.getElementById(
"husband"
).value="";


}


}



</script>



<script src="apply.js"></script>


</body>

</html>
```
