<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>રેશન કાર્ડ અરજી</title>

<link rel="stylesheet" href="apply.css">

</head>


<body>


<header>

<div class="logo">

<i>🪪</i>
Rajkumar Ration Card

</div>


<a href="index.html" class="back">
← Home
</a>


</header>





<section class="apply-page">


<div class="apply-card">


<h1>
રેશન કાર્ડ અરજી ફોર્મ
</h1>


<p>
તમારી માહિતી ભરો
</p>



<input 
type="text"
id="name"
placeholder="અરજદારનું નામ">



<input 
type="number"
id="mobile"
placeholder="મોબાઇલ નંબર">



<input 
type="text"
id="village"
placeholder="ગામ">



<select id="service">


<option value="">
સેવા પસંદ કરો
</option>


<option>
નવું રેશન કાર્ડ
</option>


<option>
નામ ઉમેરવું
</option>


<option>
નામ કાપવું
</option>


<option>
સરનામું સુધારવું
</option>


<option>
મોબાઇલ નંબર લિંક
</option>


<option>
ડુપ્લિકેટ રેશન કાર્ડ
</option>


</select>
  <!-- Aadhaar Upload -->
<label>આધાર કાર્ડ PDF</label>
<input 
type="file"
id="aadhaar"
accept=".pdf">


<!-- Ration Card Upload -->
<label>રેશન કાર્ડ PDF</label>
<input 
type="file"
id="ration"
accept=".pdf">


<!-- Payment Screenshot Upload -->
<label>Payment Screenshot</label>
<input 
type="file"
id="payment"
accept="image/*,.pdf">




<button onclick="sendApplication()">

અરજી મોકલો

</button>



<div id="msg"></div>



</div>


</section>




<script src="apply.js"></script>


</body>

</html>
